services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - karm-mongo:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/karm
      JWT_SECRET: change-this-in-deployment
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - karm-uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  karm-mongo:
  karm-uploads:
